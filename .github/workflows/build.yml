name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev python3 dpkg-dev smartmontools
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack -G DEB
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: drivewatch-deb
          path: build/*.deb
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drivewatch-deb
          path: release
      - name: Publish tested preview package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(DriveWatch VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          package="drivewatch_${version}_amd64.deb"
          test -f "release/$package"
          (cd release && sha256sum "$package" > SHA256SUMS)
          gh release create "v$version" "release/$package" release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "v$version — Preview update" \
            --notes-file "docs/releases/v$version.md" --prerelease
